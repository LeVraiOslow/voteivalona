# ============================================================
#  Récompenses des paliers de vote (réinitialisés le 1er de chaque mois)
#
#  Ajoute / retire des paliers librement (le nombre est le nombre de votes requis),
#  puis donne-leur un emplacement dans menus/paliers.yml (section "paliers").
#
#  description : lignes affichées dans le lore du menu (à la place de %rewards%)
#  commands / items / messages / title / sound : comme rewards/vote.yml
#  Placeholders : %player% %palier% %votes% ...
#
#  Exemples fournis : adapte-les (la commande eco nécessite Essentials / Vault).
#  Exemple Nexo : items: { cle: { item: "nexo:monitem", amount: 1 } }
# ============================================================

paliers:
  10:
    description:
      - "&7• &e50.000<glyph:dollars1>"
    commands:
      - "[console] eco give %player% 50000"
  20:
    description:
      - "&7• &e75.000<glyph:dollars1>"
      - "&7• &e2 &aClés Vote"
    commands:
      - "[console] eco give %player% 75000"
      - "[console] crates givekey %player% cle_vote 2"
