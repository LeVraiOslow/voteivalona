# ============================================================
#  Récompense de la VoteParty (donnée à tous les joueurs connectés)
#  Même format que rewards/vote.yml
#  Le nombre de votes nécessaires se règle dans config/config.yml (voteparty.votes-required)
# ============================================================

commands:
  - "[console] eco give %player% 1000"

items:
  diamant:
    item: DIAMOND
    amount: 5

messages:
  - "%prefix%&dTu as reçu ta récompense de la VoteParty !"

title:
  title: "&d&lVOTEPARTY"
  subtitle: "&7Merci à tous pour vos votes !"
  fade-in: 10
  stay: 60
  fade-out: 20

sound: "ui.toast.challenge_complete;1;1"
