name: AzuriumVote
version: '${project.version}'
main: fr.azurium.vote.AzuriumVote
api-version: '26.2'
description: Vote, VoteParty et paliers de vote mensuels (compatible AzLink / Azuriom et Nexo)
author: Ivalona
softdepend: [Nexo, AzLink, PlaceholderAPI]

commands:
  vote:
    description: Ouvre le menu de vote
    usage: /vote
    aliases: [votes]

permissions:
  azuriumvote.use:
    description: Utiliser /vote
    default: true
  azuriumvote.admin:
    description: Commandes d'administration (/vote reload, addvote, ...)
    default: op
