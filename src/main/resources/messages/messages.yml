# ============================================================
#  AzuriumVote - Messages
#  Couleurs : &a, &b ... / hex : &#RRGGBB ou <#RRGGBB>
#  Une valeur vide ("") désactive le message.
#  Placeholders : %prefix% %player% %votes% %total_votes% %pending% %claimable%
#                 %current% %required% %remaining% %percent% %bar% %server_total%
#                 %party_count% %month% %url% (+ %amount% %palier% %palier_remaining% selon le message)
# ============================================================

prefix: "&#E87833&lɪᴠᴀʟᴏɴᴀ &7» "

no-permission: "%prefix%&cTu n'as pas la permission."
player-only: "%prefix%&cCette commande est réservée aux joueurs."
unknown-player: "%prefix%&cJoueur inconnu : &e%target%"
reload: "%prefix%&eConfiguration rechargée."

# Lien de vote (chaque ligne est cliquable)
vote-link:
  - "%prefix%&eClique ici pour voter &7→ &6&n%url%"
vote-link-hover: "&eClique pour accèder au site"

vote-broadcast: "%prefix%&e%player% &7vient de voter ! &8(&c%current%&7/&e%required%&8) &7→ &e/vote"

pending-join: "%prefix%&eTu as &6%pending% &erécompense(s) de vote en attente ! &7→ &e/vote"
pending-claimed: "%prefix%&eTu as récupéré &6%amount% &erécompense(s) de vote !"
no-pending: "%prefix%&cTu n'as aucune récompense en attente."

palier-claimed: "%prefix%&eTu as récupéré le palier &6%palier% votes &e!"
palier-locked: "%prefix%&cIl te manque &e%palier_remaining% &cvote(s) pour ce palier."
palier-already: "%prefix%&cTu as déjà récupéré ce palier ce mois-ci."
palier-available: "%prefix%&eTu peux récupérer le palier &6%palier% votes &e! &7→ &e/vote"

# Diffusé à tous les joueurs quand la VoteParty se déclenche
party-start:
  - ""
  - "%prefix%&6&lᴠᴏᴛᴇᴘᴀʀᴛʏ &7→ &eLe serveur a atteint &6%required% votes &e!"
  - "%prefix%&eTous les joueurs connectés reçoivent une récompense !"
  - ""

# Envoyé quand le joueur clique sur l'item VoteParty
party-info:
  - "%prefix%&6ᴠᴏᴛᴇᴘᴀʀᴛʏ &7→ &c%current%&7/&e%required% &evotes &8(&7%percent%%&8)"
  - "%prefix%&eVotes totaux sur le serveur : &6%server_total%"

month-reset: "%prefix%&eNouveau mois ! Les paliers de vote ont été réinitialisés. &7→ &e/vote"

# Administration
usage-admin:
  - "%prefix%&e/vote reload"
  - "%prefix%&e/vote addvote <joueur> [nombre]"
  - "%prefix%&e/vote setparty <nombre>"
  - "%prefix%&e/vote forceparty"
  - "%prefix%&e/vote resetmonth <joueur|all>"
  - "%prefix%&e/vote info <joueur>"
admin-vote-added: "%prefix%&a+%amount% vote(s) enregistré(s) pour &e%target%&a."
admin-vote-queued: "%prefix%&eJoueur &6%target% &einconnu : &a%amount% &evote(s) mis en attente, appliqué(s) à sa prochaine connexion."
admin-party-set: "%prefix%&aCompteur VoteParty : &e%current%&7/&e%required%"
admin-party-forced: "%prefix%&aVoteParty déclenchée."
admin-reset-player: "%prefix%&aPaliers du mois réinitialisés pour &e%target%&a."
admin-reset-all: "%prefix%&aPaliers du mois réinitialisés pour tous les joueurs."
admin-info:
  - "%prefix%&7Joueur : &e%target%"
  - "%prefix%&7Votes ce mois-ci : &f%votes% &8| &7Total : &f%total_votes%"
  - "%prefix%&7Récompenses en attente : &f%pending% &8| &7Paliers à récupérer : &f%claimable%"
