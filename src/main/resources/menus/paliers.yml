# ============================================================
#  Menu des paliers de vote
#
#  claim-click : clic pour récupérer un palier (LEFT, RIGHT, SHIFT_LEFT, ...)
#  items       : items fixes (retour, infos...) - mêmes options que menus/main.yml
#  states      : modèle d'item selon l'état du palier : locked / claimable / claimed
#  paliers     : emplacement (slot) de chaque palier. Les paliers eux-mêmes (10, 20, ...)
#                et leurs récompenses se définissent dans rewards/paliers.yml.
#                Optionnel : redéfinir l'item d'un seul palier
#                (ex. 500: { slot: 24, claimable: { item: "nexo:monitem" } })
#
#  Placeholders en plus : %palier% %palier_remaining% %state%
#  Ligne de lore "%rewards%" = remplacée par la description du palier (rewards/paliers.yml)
# ============================================================

title: "<shift:-52><glyph:royaume_vote2>"
size: 36
claim-click: LEFT

filler:
  item: nexo:air
  name: " "

items:
  info:
    slot: 4
    item: nexo:quest
    name: "&6&lᴠᴏᴛᴇs ᴄᴇ ᴍᴏɪs ᴄɪ"
    lore:
      - "&8ɪɴғᴏʀᴍᴀᴛɪᴏɴs"
      - ""
      - "&7• ᴠᴏᴛᴇs ᴅᴜ ᴍᴏɪs: &e%votes%"
      - "&7• ᴠᴏᴛᴇs ᴛᴏᴛᴀʟ: &e%total_votes%"
      - ""
      - "&7(Les paliers sont réinitialisés"
      - "&7tous les 1er de chaque mois.)"
  back:
    slot: 31
    item: nexo:non
    name: "&c&lʀᴇᴛᴏᴜʀ"
    action: MAIN

states:
  locked:
    item: nexo:giftgray
    name: "&e&l%palier% &6&lᴠᴏᴛᴇs"
    lore:
      - "&8ɪɴғᴏʀᴍᴀᴛɪᴏɴs"
      - ""
      - "&7• ᴘʀᴏɢʀᴇssɪᴏɴ: &c%votes%&8/&e%palier%"
      - ""
      - "&6ʀᴇᴄᴏᴍᴘᴇɴsᴇs:"
      - "%rewards%"
  claimable:
    item: nexo:giftgreen
    name: "&e&l%palier% &6&lᴠᴏᴛᴇs"
    glow: true
    lore:
      - "&8ɪɴғᴏʀᴍᴀᴛɪᴏɴs"
      - ""
      - "&6ʀᴇᴄᴏᴍᴘᴇɴsᴇs:"
      - "%rewards%"
      - ""
      - "&6ᴄʟɪᴄᴋ ɢᴀᴜᴄʜᴇ &7→ &eRécupéré"
  claimed:
    item: nexo:yess
    name: "&e&l%palier% &6&lᴠᴏᴛᴇs"
    lore:
      - "&8ɪɴғᴏʀᴍᴀᴛɪᴏɴs"
      - ""
      - "&7• sᴛᴀᴛᴜᴛ: &a✔ Récupéré"

paliers:
  10:
    slot: 11
  20:
    slot: 12
  30:
    slot: 13
  50:
    slot: 14
  75:
    slot: 15
  100:
    slot: 20
  150:
    slot: 21
  200:
    slot: 22
  300:
    slot: 23
  500:
    slot: 24
